<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/w3css/4/w3.css">
    <link rel="stylesheet" href="popup.css">
    <script src="/lib/theme.js"></script>
</head>

<body style="width: 380px;">
    <header class="popupHeader">
        <div class="popupBrand">
            <img class="popupLogo" src="/icons/icon-48.png" alt="">
            <span id="popupTitle">Atlas Translation</span>
        </div>
        <div class="popupActions">
            <!-- Shows the service that translates this page. It is a label, not a switch: the service is chosen in Settings. -->
            <span id="serviceBadge" class="serviceBadge" role="img" aria-label="Translation service" title="">
                <img id="iconTranslate" src="/icons/google-translate-32.png" alt="">
            </span>
            <button type="button" id="btnSettings" class="iconButton" title="Settings" data-i18n-title="lblSettings"
                aria-label="Settings">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- The options list. It is always shown: site and language rules, page actions, More options and About. -->
    <div id="menuPanel" class="menuPanel"></div>

    <div id="updateBanner" class="updateBanner" role="status" hidden>
        <div class="updateBannerText"><span id="updateText"></span><br /><span id="updateHelp" class="updateHelp"></span></div>
        <button type="button" id="btnUpdateDownload"></button>
    </div>

    <!-- Language choice: the page's original language and three target languages. -->
    <div class="w3-bar langBar" id="langBar" role="group" aria-label="Language">
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue w3-buttonSelected" title="Show original"
            data-i18n-title="btnRestore" value="original"><span data-i18n="btnMobileOriginal">Original</span><span
                class="langSub" id="lblOriginalLanguage"></span></button>
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue" title="Translate" data-i18n-title="btnTranslate"
            value="en">English</button>
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue" title="Translate" data-i18n-title="btnTranslate"
            value="es">Spanish</button>
        <button class="w3-bar-item w3-button w3-ripple w3-hover-light-blue" title="Translate" data-i18n-title="btnTranslate"
            value="de">German</button>
    </div>

    <p id="serviceNotice" class="serviceNotice" role="note" hidden></p>
    <p id="serviceUsage" class="serviceUsage" role="status" hidden></p>

    <div class="popupBody">
        <button type="button" data-i18n="msgImproveTranslation" id="btnImproveTranslation" class="improveButton">Improve translation</button>
    </div>
    <script src="/lib/polyfill.js"></script>
    <script src="/lib/checkedLastError.js"></script>
    <script src="/lib/stuff.js"></script>
    <script src="detect-pdf.js"></script>
    <script src="/lib/languages.js"></script>
    <script src="/lib/config.js"></script>
    <script src="/lib/i18n.js"></script>
    <script src="popup.js"></script>
</body>

</html>
