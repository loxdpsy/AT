<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Translation helper</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <img src="/icon.png" alt="" width="48" height="48">
    <div>
      <h1>Atlas Translation</h1>
      <p class="subtitle">Helper: updates and browser setup</p>
    </div>
  </header>

  <main>
    <p id="tokenWarning" class="notice" hidden></p>

    <section class="card" id="updateCard">
      <h2>Update</h2>
      <p id="updateText" class="lead">Checking for updates&hellip;</p>
      <div class="row">
        <button id="installBtn" class="primary" disabled>Install update</button>
        <span id="installResult" class="result" role="status"></span>
      </div>
    </section>

    <section class="card">
      <h2>Folder</h2>
      <p class="hint">The folder that holds the extension. It is created when it is empty or missing.</p>
      <div class="row">
        <input id="folder" type="text" spellcheck="false" autocomplete="off" aria-label="Folder">
        <button id="useFolder">Use this folder</button>
      </div>
    </section>

    <section class="card">
      <h2>Which browser?</h2>
      <p class="hint">Choose the browser you want Atlas Translation in.</p>
      <div id="browsers" class="grid"></div>
      <div id="guide" class="guide" hidden>
        <h3 id="guideTitle"></h3>
        <ol id="guideSteps"></ol>
        <div id="guideActions" class="row"></div>
        <span id="guideResult" class="result" role="status"></span>
      </div>
    </section>
  </main>

  <footer>
    <span>Helper <span id="helperVersion"></span></span>
    <a href="https://github.com/loxdpsy/AT" target="_blank" rel="noopener">Help and support</a>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
