# Builds and tests the atlas-updater helper (tools/atlas-updater) on Windows, macOS and Linux.
# Each build is kept as an artifact, so it can be downloaded from the run page.
name: Updater

on:
  push:
    paths:
      - "tools/atlas-updater/**"
      - ".github/workflows/updater.yml"
  pull_request:
    paths:
      - "tools/atlas-updater/**"
      - ".github/workflows/updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: atlas-updater
            artifact: atlas-updater-linux
          - os: macos-latest
            binary: atlas-updater
            artifact: atlas-updater-macos
          - os: windows-latest
            binary: atlas-updater.exe
            artifact: atlas-updater-windows
    defaults:
      run:
        shell: bash
        working-directory: tools/atlas-updater
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (the helper window needs Rust 1.92 or later)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the GTK and WebKitGTK development files (Linux, for the helper window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Unit tests
        id: tests
        run: cargo test --release 2>&1 | tee "$RUNNER_TEMP/updater-test.log"

      - name: Build
        id: build
        run: cargo build --release

      - name: Refuses a folder that is not Atlas Translation (no network needed)
        id: refuse
        run: |
          folder="$RUNNER_TEMP/not-atlas"
          mkdir -p "$folder"
          echo '{"name": "Something else", "version": "1.0"}' > "$folder/manifest.json"
          set +e
          output=$("./target/release/${{ matrix.binary }}" "$folder" 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 1
          echo "$output" | grep -q "is not the Atlas Translation folder"

      - name: Installs the latest release into a test folder (uses GitHub, checksum and unzip)
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log="${{ runner.temp }}/install-output.txt"
          : > "$log"
          exec > >(tee -a "$log") 2>&1
          # Nothing to install until a release is published. Skip the test then, and say so in the log.
          published=$(gh api "repos/${{ github.repository }}/releases?per_page=10" --jq '[.[] | select(.draft | not)] | length')
          if [ "$published" = "0" ]; then
            echo "No published release yet, so there is nothing to install. The install test is skipped."
            exit 0
          fi
          folder="${{ runner.temp }}/atlas-install-test"
          rm -rf "$folder"
          mkdir -p "$folder"
          echo '{"name": "Atlas Translation", "version": "0.0.1.0"}' > "$folder/manifest.json"
          echo "== first run"
          "./target/release/${{ matrix.binary }}" "$folder"
          echo "== installed files"
          ls -la "$folder" | head -40
          grep -q '"name": "Atlas Translation"' "$folder/manifest.json"
          if grep -q '"version": "0.0.1.0"' "$folder/manifest.json"; then
            echo "manifest.json was not replaced"
            exit 1
          fi
          test -f "$folder/service_worker.js"
          echo "== second run"
          second=$("./target/release/${{ matrix.binary }}" "$folder" 2>&1)
          echo "$second"
          echo "$second" | grep -q "You have the latest version"

      - name: Keep the install output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-output-${{ matrix.artifact }}
          path: ${{ runner.temp }}/install-output.txt
          if-no-files-found: warn

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/atlas-updater/target/release/${{ matrix.binary }}
          if-no-files-found: error

      # Runs even when a step failed. Shows each step's result, the unit test failures and the install output when they
      # failed, and the size and SHA-256 of the built helper when it was built. A summary problem never fails the job.
      - name: Job summary
        if: always()
        continue-on-error: true
        env:
          ASSET: ${{ matrix.artifact }}
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "## Updater helper: ${{ matrix.os }}"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Refuses a folder that is not Atlas Translation | ${{ steps.refuse.outcome }} |"
            echo "| Installs the latest release | ${{ steps.install.outcome }} |"
            echo ""
          } >> "$summary"

          if [ "${{ steps.tests.outcome }}" = "failure" ] && [ -f "$RUNNER_TEMP/updater-test.log" ]; then
            {
              echo "### Unit test failures"
              echo ""
              echo "Lines that name a failed test or a panic (the first 60). The full log is in the Unit tests step."
              echo ""
              echo '```'
              grep -E "panicked|FAILED|failed|error" "$RUNNER_TEMP/updater-test.log" | head -n 60 || true
              echo '```'
              echo ""
            } >> "$summary"
          fi

          if [ "${{ steps.install.outcome }}" = "failure" ] && [ -f "$RUNNER_TEMP/install-output.txt" ]; then
            {
              echo "### Install output (last 40 lines)"
              echo ""
              echo '```'
              tail -n 40 "$RUNNER_TEMP/install-output.txt"
              echo '```'
              echo ""
            } >> "$summary"
          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            file="$GITHUB_WORKSPACE/tools/atlas-updater/target/release/${{ matrix.binary }}"
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              digest=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "$file")
              {
                echo "### Helper: $ASSET"
                echo ""
                echo "- Size: $size bytes"
                echo "- SHA-256: \`$digest\`"
                echo ""
              } >> "$summary"
            fi
          fi
