# Builds the offline translation engine (tools/atlas-engine, built from bergamot-translator) for Windows, macOS and
# Linux. Each build is checked with a real language pack: scripts/engine-smoke.mjs downloads the English to French pack
# from the catalogue, checks it, and translates. Each program is kept as an artifact for the release.
#
# macOS builds on an Intel runner: the int8 models use intgemm, which is an x86 library.
name: Engine

on:
  push:
    paths:
      - "tools/atlas-engine/**"
      - "tools/atlas-updater/src/packs.json"
      - "scripts/engine-smoke.mjs"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "tools/atlas-engine/**"
      - "tools/atlas-updater/src/packs.json"
      - "scripts/engine-smoke.mjs"
      - ".github/workflows/engine.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: atlas-engine
            asset: atlas-engine-linux
          - os: macos-15-intel
            binary: atlas-engine
            asset: atlas-engine-macos
          - os: windows-latest
            binary: atlas-engine.exe
            asset: atlas-engine-windows.exe
    # The PCRE2 copy that SentencePiece downloads is configured during the Build step, not the Configure step, so the
    # variable must be set for the whole job. CMake 4 refuses the old CMake minimum that PCRE2 and SentencePiece declare.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check out bergamot-translator (with its submodules)
        uses: actions/checkout@v4
        with:
          repository: browsermt/bergamot-translator
          ref: v0.4.5
          submodules: recursive
          path: tools/atlas-engine/bergamot

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Windows only: PCRE2 for ssplit comes from vcpkg, built as a static library with the static C runtime (/MT), the
      # same runtime marian-dev and bergamot use. CMAKE_PREFIX_PATH points CMake at it. See tools/atlas-engine/CMakeLists.txt.
      - name: Install PCRE2 (Windows)
        if: runner.os == 'Windows'
        run: |
          root=$(cygpath -u "$VCPKG_INSTALLATION_ROOT")
          "$root/vcpkg.exe" install pcre2:x64-windows-static
          echo "CMAKE_PREFIX_PATH=$(cygpath -m "$root/installed/x64-windows-static")" >> "$GITHUB_ENV"

      - name: Configure
        id: configure
        run: cmake -S tools/atlas-engine -B build/engine -DCMAKE_BUILD_TYPE=Release

      # The log is kept for the job summary. On Linux and macOS, -k keeps going after an error, so one run lists every
      # failing file instead of only the first one. Windows (MSBuild) stops at the failed project.
      - name: Build
        id: build
        run: |
          set -o pipefail
          cmake --build build/engine --config Release --parallel 4 ${{ runner.os != 'Windows' && '-- -k' || '' }} 2>&1 | tee "$RUNNER_TEMP/engine-build.log"

      - name: Find the program
        id: find
        run: |
          found=$(find build/engine -type f -name "${{ matrix.binary }}" | head -n 1)
          if [ -z "$found" ]; then
            echo "::error::${{ matrix.binary }} was not built"
            exit 1
          fi
          echo "path=$found" >> "$GITHUB_OUTPUT"

      - name: Translate English to French with the real language pack
        id: smoke
        # The output is kept for the job summary. The step still fails when the test fails (bash runs with pipefail).
        run: node scripts/engine-smoke.mjs "${{ steps.find.outputs.path }}" 2>&1 | tee "$RUNNER_TEMP/engine-smoke.log"

      - name: Name the program for the release
        id: name
        run: cp "${{ steps.find.outputs.path }}" "$RUNNER_TEMP/${{ matrix.asset }}"

      - name: Keep the program for the release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error

      # Runs even when a step failed. Shows each step's result, the compiler and linker errors when the build failed,
      # and the size and SHA-256 of the program when it was built. A summary problem never fails the job.
      - name: Job summary
        if: always()
        continue-on-error: true
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "## Offline engine: ${{ matrix.os }}"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Configure | ${{ steps.configure.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Find the program | ${{ steps.find.outcome }} |"
            echo "| Translate with the real language pack | ${{ steps.smoke.outcome }} |"
            echo "| Name for the release | ${{ steps.name.outcome }} |"
            echo ""
          } >> "$summary"

          log="$RUNNER_TEMP/engine-build.log"
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            {
              echo "### Build errors"
              echo ""
              echo "Compiler, linker and make lines (the first 80). The full log is in the Build step."
              echo ""
              echo '```'
              if [ -f "$log" ]; then
                grep -E ': error|error [A-Z]+[0-9]+|LNK[0-9]+|\*\*\* |failed' "$log" | head -n 80 || true
              fi
              echo '```'
              echo ""
            } >> "$summary"
          fi

          smokelog="$RUNNER_TEMP/engine-smoke.log"
          if [ "${{ steps.smoke.outcome }}" = "failure" ] && [ -f "$smokelog" ]; then
            {
              echo "### Translation test output"
              echo ""
              echo "The last 60 lines of the test output (the download, the engine start and the translations)."
              echo ""
              echo '```'
              tail -n 60 "$smokelog"
              echo '```'
              echo ""
            } >> "$summary"
          fi

          if [ "${{ steps.name.outcome }}" = "success" ]; then
            file="$RUNNER_TEMP/$ASSET"
            size=$(wc -c < "$file")
            digest=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "$file")
            {
              echo "### Program: $ASSET"
              echo ""
              echo "- Size: $size bytes"
              echo "- SHA-256: \`$digest\`"
              echo ""
            } >> "$summary"
          fi

      # The raw logs, as an artifact. Log text from a run is not readable without signing in, so this keeps the
      # compiler output and the test output for debugging. It is not an atlas-engine-* artifact, so release.yml does not
      # download it.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-logs-${{ matrix.asset }}
          path: |
            ${{ runner.temp }}/engine-build.log
            ${{ runner.temp }}/engine-smoke.log
          if-no-files-found: ignore
          retention-days: 7
