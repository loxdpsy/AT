# Probe (manual): can GitHub runners read Mozilla's model bucket, and which full-precision files sit next to the int8
# models? Results are printed as notices (check-run annotations). Not part of a release.
name: ARM pack probe

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Language pair folder in the bucket, e.g. en-fr"
        required: false
        default: "en-fr"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Read the bucket
        env:
          PAIR: ${{ inputs.pair }}
        run: |
          set -u
          B=https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data
          curl -sS -o /tmp/db.sqlite -w "db http %{http_code} bytes %{size_download}\n" "$B/db/db.sqlite" || true
          curl -sS "https://storage.googleapis.com/storage/v1/b/moz-fx-translations-data--303e-prod-translations-data/o?prefix=models/$PAIR/&delimiter=/&maxResults=50" -o /tmp/dirs.json -w "list http %{http_code}\n" || true
          python3 - <<'PY'
          import json, os
          def note(msg):
              msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::notice::" + msg)
          try:
              d = json.load(open("/tmp/dirs.json"))
              prefixes = d.get("prefixes", [])
              note("prefixes (%d): %s" % (len(prefixes), " ".join(prefixes)[:3500]))
          except Exception as e:
              note("list failed: %s" % e)
          PY
      - name: Schema of the registry database
        run: |
          set -u
          if [ -s /tmp/db.sqlite ]; then
            sqlite3 /tmp/db.sqlite ".tables" 2>&1 | head -c 1500 | sed 's/^/::notice::tables: /' || true
            sqlite3 /tmp/db.sqlite ".schema" 2>&1 | tr '\n' ' ' | head -c 3500 | sed 's/^/::notice::schema: /' || true
          else
            echo "::warning::registry database not downloaded"
          fi
      - name: Files of one training run folder (the first one that has a quantized model)
        env:
          PAIR: ${{ inputs.pair }}
        run: |
          set -u
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          def note(msg):
              msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::notice::" + msg)
          pair = os.environ["PAIR"]
          base = "https://storage.googleapis.com/storage/v1/b/moz-fx-translations-data--303e-prod-translations-data/o"
          def listing(prefix, delim=None):
              q = {"prefix": prefix, "maxResults": "1000"}
              if delim: q["delimiter"] = delim
              with urllib.request.urlopen(base + "?" + urllib.parse.urlencode(q), timeout=60) as r:
                  return json.load(r)
          try:
              runs = listing("models/%s/" % pair, "/").get("prefixes", [])
              note("runs (%d): %s" % (len(runs), " ".join(runs[-5:])))
              for run in reversed(runs):
                  items = listing(run, "/").get("prefixes", [])
                  kinds = [p.rstrip("/").split("/")[-1] for p in items]
                  if "quantized/" not in [k + "/" for k in kinds] and not any(k == "quantized" for k in kinds):
                      continue
                  note("run %s has folders: %s" % (run, " ".join(kinds)))
                  for kind in ("quantized", "student", "exported"):
                      if kind in kinds:
                          files = listing(run + kind + "/").get("items", [])
                          note("%s/%s: %s" % (run, kind, " | ".join("%s %s" % (f["name"].split("/")[-1], f.get("size", "?")) for f in files)[:3500]))
                  break
          except Exception as e:
              note("bucket listing failed: %s" % e)
          PY
