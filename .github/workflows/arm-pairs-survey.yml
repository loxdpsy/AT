name: Survey of fp32 models (temporary)

on:
  push:
    paths:
      - ".github/workflows/arm-pairs-survey.yml"

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Survey the bucket for every pair
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          B = "https://storage.googleapis.com/storage/v1/b/moz-fx-translations-data--303e-prod-translations-data/o"
          LINES = []
          def note(msg):
              LINES.append(msg)
          def listing(prefix, fields):
              items, token = [], None
              while True:
                  q = {"prefix": prefix, "maxResults": "1000", "fields": fields}
                  if token: q["pageToken"] = token
                  with urllib.request.urlopen(B + "?" + urllib.parse.urlencode(q), timeout=180) as r:
                      d = json.load(r)
                  items += d.get("items", [])
                  token = d.get("nextPageToken")
                  if not token: break
              return items
          cat = json.load(open("tools/atlas-updater/src/packs.json"))["packs"]
          for p in cat:
              try:
                  ref = "%s-%s" % (p["from"], p["to"])
                  files = p["files"]
                  model = [f for f in files if f["name"].startswith("model.")][0]
                  others = sum(f["size"] for f in files if not f["name"].startswith("model."))
                  objs = listing("models/%s/" % ref, "items(name,size),nextPageToken")
                  runs = [o["name"][:-len("quantized/model.intgemm.alphas.bin")] for o in objs
                          if o["name"].endswith("quantized/model.intgemm.alphas.bin") and int(o["size"]) == model["size"]]
                  if not runs:
                      note("%s: no run with the catalogue int8 model (%d objects under models/%s/)" % (p["pair"], len(objs), ref))
                      continue
                  run = runs[0]
                  npz = [o for o in objs if o["name"].startswith(run + "student/") and o["name"].endswith(".npz")]
                  best = [o for o in npz if o["name"].endswith("final.model.npz.best-chrf.npz")]
                  pick = best[0] if best else (npz[0] if npz else None)
                  if pick is None:
                      note("%s: run %s has NO student .npz" % (p["pair"], run))
                      continue
                  fp32_total = int(pick["size"]) + others
                  note("%s: npz %s size %s | int8 pack %d | fp32 pack %d (%.1f MB) | run %s" % (
                      p["pair"], pick["name"].split("/")[-1], pick["size"], p["bytes"], fp32_total, fp32_total / 1e6, run))
              except Exception as e:
                  note("%s: error %s" % (p.get("pair"), e))
          LINES.append("survey done: %d pairs" % len(cat))
          chunks, cur = [], ""
          for line in LINES:
              if len(cur) + len(line) + 1 > 3000:
                  chunks.append(cur); cur = ""
              cur += line + "\n"
          chunks.append(cur)
          for i, c in enumerate(chunks):
              out = c.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::notice title=survey %d::" % (i + 1) + out)
          PY
