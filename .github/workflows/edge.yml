name: Edge Add-ons

# Uploads the Chromium package to an existing Microsoft Edge Add-ons listing and submits it for certification.
# Called by release.yml after the Chromium build. You can also set the secrets and run a release to test it.
#
# Secrets (Settings > Secrets and variables > Actions):
#   EDGE_PRODUCT_ID  the product GUID from the Edge extension overview page
#   EDGE_CLIENT_ID   from Partner Center > Publish API > Create API credentials
#   EDGE_API_KEY     the API key from the same page. It expires, so note the date.
#
# If any secret is missing, the job is skipped and the summary says so.
# The first submission must be done by hand in Partner Center. The API can only update an existing product.

on:
  workflow_call:
    inputs:
      version:
        description: "Version that was built, for example 9.8.2.0"
        type: string
        required: true
      ref:
        description: "Commit to test and submit (defaults to the commit that started the run)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The Edge package is the Chromium build, so the same checks must pass before anything is sent to Microsoft.
  test:
    name: Test before the Edge submission
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the repository
        run: npm run check

      - name: Run the unit tests
        run: npm test

  submit:
    name: Submit to Edge Add-ons
    needs: test
    runs-on: ubuntu-latest
    env:
      EDGE_API: https://api.addons.microsoftedge.microsoft.com
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the Edge secrets
        id: check
        run: |
          if [ -z "$EDGE_PRODUCT_ID" ] || [ -z "$EDGE_CLIENT_ID" ] || [ -z "$EDGE_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Edge secrets are not set. Skipping the Edge submission."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the Chromium package
        if: steps.check.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: atlas-translation-chromium
          path: dist

      - name: Upload the package and submit it
        id: submit
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ZIP="dist/atlas-translation-${VERSION}-chromium.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP not found in the Chromium artifact"
            exit 1
          fi

          # Turn a Location header into a full URL. The header can be a full URL, a path starting with /,
          # a path without the leading /, or only the operation ID. $2 is the operations path to use for an ID.
          resolve() {
            local loc="$1" ops="$2"
            loc=$(printf '%s' "$loc" | tr -d '[:space:]')
            case "$loc" in
              http*) echo "$loc" ;;
              /*) echo "$EDGE_API$loc" ;;
              */*) echo "$EDGE_API/$loc" ;;
              *) echo "$EDGE_API/v1/products/$EDGE_PRODUCT_ID/$ops/$loc" ;;
            esac
          }

          # Poll an operation until it succeeds, fails, or times out (about 10 minutes).
          wait_for_operation() {
            local url="$1" label="$2" body status
            for i in $(seq 1 60); do
              body=$(curl -sS -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID" "$url")
              status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
              echo "$label: ${status:-unknown} (check $i)"
              case "$status" in
                Succeeded) return 0 ;;
                Failed)
                  echo "$body"
                  # Edge accepts one submission at a time. Return 2 so the caller can report it without failing the run.
                  if printf '%s' "$body" | jq -e '.errorCode == "InProgressSubmission"' >/dev/null 2>&1; then
                    return 2
                  fi
                  echo "::error::Edge $label failed. See the response above."
                  return 1 ;;
              esac
              sleep 10
            done
            echo "::error::Edge $label did not finish in time"
            return 1
          }

          # 1. Upload the package to the draft submission.
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w "%{http_code}" -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ZIP" \
            "$EDGE_API/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package")
          if [ "$code" != "202" ]; then
            echo "::error::Package upload returned HTTP $code"
            cat "$headers"
            exit 1
          fi
          loc=$(tr -d '\r' < "$headers" | grep -i '^location:' | sed 's/^[Ll]ocation: *//' || true)
          if [ -n "$loc" ]; then
            echo "Upload operation: $loc"
            wait_for_operation "$(resolve "$loc" "submissions/draft/package/operations")" "package upload"
          else
            echo "::warning::No Location header returned for the upload. Check the draft in Partner Center."
          fi

          # 2. Submit the draft for certification.
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w "%{http_code}" -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/json" \
            -d "{\"notes\": \"Atlas Translation $VERSION. Release notes are on the GitHub release.\"}" \
            "$EDGE_API/v1/products/$EDGE_PRODUCT_ID/submissions")
          if [ "$code" != "202" ]; then
            echo "::error::Submission returned HTTP $code"
            cat "$headers"
            exit 1
          fi
          loc=$(tr -d '\r' < "$headers" | grep -i '^location:' | sed 's/^[Ll]ocation: *//' || true)
          rc=0
          if [ -n "$loc" ]; then
            echo "Submission operation: $loc"
            set +e
            wait_for_operation "$(resolve "$loc" "submissions/operations")" "submission"
            rc=$?
            set -e
          fi
          if [ "$rc" = "2" ]; then
            # The package is in the draft. Edge will not take a second submission until the earlier one finishes.
            echo "::warning::Edge is still reviewing an earlier submission, so $VERSION was not submitted. The package is in the draft. Run this job again (or submit in Partner Center) after that review finishes."
            echo "waiting" > edge-state.txt
            echo "state=waiting" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" != "0" ]; then
            exit 1
          fi
          echo "Submitted $VERSION to Edge Add-ons for certification."

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Edge Add-ons: ${VERSION}"
            echo
            if [ "${{ steps.check.outputs.ready }}" != "true" ]; then
              echo "Skipped. Set the EDGE_PRODUCT_ID, EDGE_CLIENT_ID and EDGE_API_KEY secrets to submit automatically."
            elif [ "${{ steps.submit.outputs.state }}" = "waiting" ]; then
              echo "The package is in the Edge draft, but **not submitted**. Edge is still reviewing an earlier version, and it accepts one submission at a time. Run this job again after that review finishes, or submit the draft in Partner Center."
            elif [ "${{ job.status }}" = "success" ]; then
              echo "The package was uploaded and submitted for certification. Edge usually certifies within a few business days."
            else
              echo "The Edge submission failed. Open the job log for the error, then submit by hand in Partner Center if needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
