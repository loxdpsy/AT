name: Chromium build

# Builds loxdpsy for Chromium-based browsers:
#   - ZIP: upload to the Chrome Web Store and Microsoft Edge Add-ons
#   - CRX: signed with the CRX_PRIVATE_KEY secret (self-hosting, enterprise policy)
# Runs by hand (Actions > Chromium build > Run workflow), and from the Release workflow on version tags.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Chromium package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build the Chromium package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: npm run build:chromium

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loxdpsy-chromium
          path: |
            build/*.crx
            build/*.zip
          if-no-files-found: error

      - name: Write job summary
        if: always()
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          {
            echo "## Chromium build: loxdpsy $VERSION"
            echo ""
            echo "- Status: **${{ job.status }}**"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Minimum Chrome version: 109"
            echo ""
            echo "| File | Size | SHA-256 (first 16) |"
            echo "| --- | --- | --- |"
            for f in build/*.crx build/*.zip; do
              [ -f "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
