name: Chromium build (ZIP + CRX)

# Builds loxdpsy for Chromium-based browsers (Chrome, Edge, Brave, Opera, Vivaldi, ...).
# - Manual run: Actions > Chromium build > Run workflow. Files are kept as workflow artifacts.
# - Tag push (v*): the files are also attached to the GitHub release for that tag.
#
# Optional secret CRX_PRIVATE_KEY: the PEM private key used to sign the .crx.
# Keep the same key for every release so the extension ID stays the same.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build the Chromium package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: npm run build:chromium

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loxdpsy-chromium
          path: |
            build/*.crx
            build/*.zip
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "loxdpsy $TAG" --generate-notes
          fi
          gh release upload "$TAG" build/*.crx build/*.zip --clobber
