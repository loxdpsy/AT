name: Checks

# Runs on every pull request and on every push to main. The same checks run before each commit and push
# on a developer machine (see .githooks). Merge a pull request only after this workflow passes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # The output is kept so that a failure shows its messages as annotations, which can be read without the job log.
      - name: Check the repository
        id: check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Annotate the check failures
        if: failure() && steps.check.outcome == 'failure'
        run: |
          grep -E "FAIL|failed|error" "$RUNNER_TEMP/check.log" | head -n 30 | while IFS= read -r line; do
            echo "::error title=npm run check::${line//%/%25}"
          done

      - name: Run the unit tests
        id: test
        run: npm test

      # The Chromium build needs a signing key on GitHub. The release key stays in the Release workflow; this check
      # makes a throwaway key that is used only here and never published.
      - name: Build Chromium
        id: chromium
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/check-key.pem"
          CRX_PRIVATE_KEY="$(cat "$RUNNER_TEMP/check-key.pem")" npm run build:chromium

      - name: Build Firefox
        id: firefox
        run: npm run build:firefox

      # Runs even when a step failed. Shows the result of each step, so the cause is visible on the run page.
      # A summary problem never fails the job.
      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Checks, tests and builds"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Install dependencies | ${{ steps.install.outcome }} |"
            echo "| Check the repository | ${{ steps.check.outcome }} |"
            echo "| Unit tests | ${{ steps.test.outcome }} |"
            echo "| Build Chromium | ${{ steps.chromium.outcome }} |"
            echo "| Build Firefox | ${{ steps.firefox.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
