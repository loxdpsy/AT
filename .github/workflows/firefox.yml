name: Firefox build

# Builds loxdpsy for Firefox: ZIP and unsigned XPI.
# With "submit" turned on, the add-on is also submitted to addons.mozilla.org (AMO).
#   - AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are required for submission.
#   - AMO_CHANNEL repository variable: "listed" (default, public after Mozilla review) or "unlisted".
# Runs by hand (Actions > Firefox build > Run workflow), and from the Release workflow on version tags.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to addons.mozilla.org (needs the AMO secrets)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      submit:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Firefox package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build the Firefox package
        run: npm run build:firefox

      - name: Lint the extension with web-ext
        run: npx --yes web-ext@8 lint --source-dir build/staging/firefox --self-hosted --output text > build/web-ext-lint.txt 2>&1 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loxdpsy-firefox
          path: |
            build/*.zip
            build/*.xpi
          if-no-files-found: error

      - name: Submit to addons.mozilla.org
        if: ${{ inputs.submit }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'listed' }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO keys are not set. Skipping the submission." | tee build/amo-submit.log
            exit 0
          fi
          npx --yes web-ext@8 sign \
            --source-dir build/staging/firefox \
            --artifacts-dir build/signed \
            --channel "$AMO_CHANNEL" \
            --amo-metadata .github/amo-metadata.json \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" 2>&1 | tee build/amo-submit.log

      - name: Write job summary
        if: always()
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('firefox_manifest.json'))['version'])")
          {
            echo "## Firefox build: loxdpsy $VERSION"
            echo ""
            echo "- Build status: **${{ job.status }}**"
            echo "- Submitted to AMO: **${{ inputs.submit }}**"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| File | Size | SHA-256 (first 16) |"
            echo "| --- | --- | --- |"
            for f in build/*.zip build/*.xpi; do
              [ -f "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)\` |"
            done
            echo ""
            echo "### web-ext lint (last 15 lines)"
            echo '```'
            tail -n 15 build/web-ext-lint.txt 2>/dev/null || echo "no lint output"
            echo '```'
            if [ -f build/amo-submit.log ]; then
              echo ""
              echo "### AMO submission (last 40 lines)"
              echo '```'
              tail -n 40 build/amo-submit.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
