name: Firefox build (ZIP + XPI)

# Builds loxdpsy for Firefox (Manifest V3, Firefox 115 or newer).
# - Manual run: Actions > Firefox build > Run workflow. Files are kept as workflow artifacts.
# - Tag push (v*): the files are also attached to the GitHub release for that tag.
#
# Optional secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (addons.mozilla.org API keys).
# When both are set, the add-on is submitted to addons.mozilla.org (AMO).
#   AMO_CHANNEL (repository variable, optional): "listed" (default, public after Mozilla review)
#                                               or "unlisted" (self-distribution, signed immediately).
# Each release needs a new version number in manifest.json; AMO rejects a version that already exists.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build the Firefox package
        run: npm run build:firefox

      - name: Lint the extension with web-ext
        run: npx --yes web-ext@8 lint --source-dir build/staging/firefox --self-hosted || true

      - name: Sign the XPI (only when AMO keys are configured)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'listed' }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO keys not set: skipping signing. Unsigned XPI is in build/."
            exit 0
          fi
          npx --yes web-ext@8 sign \
            --source-dir build/staging/firefox \
            --artifacts-dir build/signed \
            --channel "${AMO_CHANNEL:-listed}" \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loxdpsy-firefox
          path: |
            build/*.xpi
            build/*.zip
            build/signed/*.xpi
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "loxdpsy $TAG" --generate-notes
          fi
          gh release upload "$TAG" build/*.xpi build/*.zip --clobber
          if ls build/signed/*.xpi >/dev/null 2>&1; then gh release upload "$TAG" build/signed/*.xpi --clobber; fi
