name: Firefox build

# Builds Atlas Translation for Firefox and Firefox for Android: a ZIP and an unsigned XPI.
# With "submit" turned on, the add-on is also submitted to addons.mozilla.org (AMO).
#   - Secrets AMO_JWT_ISSUER and AMO_JWT_SECRET are required for submission.
#   - Repository variable AMO_CHANNEL: "unlisted" (default: signed for self-distribution, no public listing) or "listed".
#   - "listed" is skipped unless the repository variable AMO_LISTING_READY is "true". Set it only after the listing has its
#     icon, screenshots, description, and license, so Mozilla never reviews an empty listing.
#   - .github/amo-metadata.json supplies the license, category, and summary AMO requires.
#
# Run it by hand: Actions > Firefox build > Run workflow. The Release workflow also calls this file.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 9.8.2.0 (leave empty for the version in firefox_manifest.json)"
        type: string
        default: ""
      submit:
        description: "Submit to addons.mozilla.org (needs the AMO secrets)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      ref:
        description: "Commit to build (defaults to the commit that started the run)"
        type: string
        default: ""
      submit:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Firefox package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set the version
        if: ${{ inputs.version != '' }}
        run: node scripts/sync-version.mjs "${{ inputs.version }}"

      - name: Install dependencies
        run: npm ci

      - name: Check and build the Firefox package
        run: npm run build:firefox

      - name: Lint the extension with web-ext
        run: npx --yes web-ext@8 lint --source-dir build/staging/firefox --self-hosted --output text > build/web-ext-lint.txt 2>&1 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-translation-firefox
          path: |
            build/*.zip
            build/*.xpi
          if-no-files-found: error

      - name: Submit to addons.mozilla.org
        if: ${{ inputs.submit }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'unlisted' }}
          AMO_LISTING_READY: ${{ vars.AMO_LISTING_READY }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO keys are not set. Skipping the submission." | tee build/amo-submit.log
            exit 0
          fi
          if [ "$AMO_CHANNEL" = "listed" ] && [ "$AMO_LISTING_READY" != "true" ]; then
            echo "Skipping the listed submission. Set the repository variable AMO_LISTING_READY to true once the AMO listing has its icon, screenshots, description, and license." | tee build/amo-submit.log
            exit 0
          fi
          if [ "$AMO_CHANNEL" = "listed" ]; then
            # AMO refuses update_url on a listed add-on (MANIFEST_UPDATE_URL). AMO updates listed add-ons itself.
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("build/staging/firefox/manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          m["browser_specific_settings"]["gecko"].pop("update_url", None)
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi
          npx --yes web-ext@8 sign \
            --source-dir build/staging/firefox \
            --artifacts-dir build/signed \
            --channel "$AMO_CHANNEL" \
            --amo-metadata .github/amo-metadata.json \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" 2>&1 | tee build/amo-submit.log

      - name: Upload the signed add-on
        if: ${{ inputs.submit }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-translation-firefox-signed
          path: build/signed/*.xpi
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('firefox_manifest.json'))['version'])")
          {
            echo "## Firefox build: Atlas Translation $VERSION"
            echo ""
            echo "- Build result: **${{ job.status }}**"
            echo "- Submitted to addons.mozilla.org: **${{ inputs.submit }}**"
            echo "- Channel: \`${{ vars.AMO_CHANNEL || 'unlisted' }}\`"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| File | Size | SHA-256 (first 16) |"
            echo "| --- | --- | --- |"
            for f in build/*.zip build/*.xpi build/signed/*.xpi; do
              [ -f "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)\` |"
            done
            echo ""
            echo "### web-ext lint (last 15 lines)"
            echo '```'
            tail -n 15 build/web-ext-lint.txt 2>/dev/null || echo "no lint output"
            echo '```'
            if [ -f build/amo-submit.log ]; then
              echo ""
              echo "### addons.mozilla.org submission (last 40 lines)"
              echo '```'
              tail -n 40 build/amo-submit.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
